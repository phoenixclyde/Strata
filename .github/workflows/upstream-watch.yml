name: Upstream watch

# Tells us when Niko1221/Strata has moved, so a rebase is a decision instead of a surprise.
#
# It deliberately does NOT rebase or push.  Three reasons, all measured or documented:
#   * a push made with GITHUB_TOKEN does not trigger any workflow, so CI would not run on
#     the result -- the branch would look green while nothing had tested it;
#   * our rebase rewrites history (a patch stack on top of upstream), so it needs a
#     force-push to the trunk; doing that unattended is how a trunk gets lost;
#   * the rebase must be followed by an engine rebuild and a bit-exactness check, and this
#     runner has no GPU.
# What is automated is detection and the reminder.  The rebase stays a five-minute human
# step, run by ci/strata-ci watch && git rebase upstream/main.

on:
  schedule:
    - cron: '23 1 * * *'      # 09:23 Asia/Shanghai
  workflow_dispatch:

concurrency:
  group: upstream-watch
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Compare with upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Niko1221/Strata.git 2>/dev/null || true
          git fetch --quiet upstream '+refs/heads/*:refs/remotes/upstream/*' --tags
          echo "upstream head: $(git log --oneline -1 upstream/main)"
          echo "latest tag   : $(git describe --tags --abbrev=0 upstream/main || echo none)"

      - name: Measure the gap
        id: gap
        run: |
          set -euo pipefail
          behind=$(git rev-list --count HEAD..upstream/main)
          base_tag=$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo none)
          {
            echo "behind=$behind"
            echo "base=$base_tag"
            echo "head_sha=$(git rev-parse --short upstream/main)"
            echo "head_subject=$(git log -1 --format=%s upstream/main)"
          } >> "$GITHUB_OUTPUT"
          echo "behind=$behind (base tag $base_tag)"
          {
            echo 'commits<<EOF'
            git log --oneline HEAD..upstream/main | head -30
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Open, update or close the reminder
        uses: actions/github-script@v7
        env:
          BEHIND: ${{ steps.gap.outputs.behind }}
          BASE: ${{ steps.gap.outputs.base }}
          HEAD_SHA: ${{ steps.gap.outputs.head_sha }}
          HEAD_SUBJ: ${{ steps.gap.outputs.head_subject }}
          COMMITS: ${{ steps.gap.outputs.commits }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, labels: 'upstream-watch', state: 'open', per_page: 10,
            });
            const behind = parseInt(process.env.BEHIND, 10);

            if (!behind) {
              for (const issue of open.data) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: 'Upstream is fully merged (0 commits behind). Closing this reminder.',
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, state: 'closed',
                });
              }
              core.info('up to date, nothing to report');
              return;
            }

            const body = [
              `**${behind} commit(s) behind** \`upstream/main\` @ \`${process.env.HEAD_SHA}\``,
              ``,
              `Latest upstream tag: \`${process.env.BASE}\`  `,
              `Upstream head: ${process.env.HEAD_SUBJ}`,
              ``,
              '```',
              process.env.COMMITS,
              '```',
              ``,
              'Rebase, then re-verify — in this order:',
              '```bash',
              'cd /home/albus/strata166/pr/strata-fork',
              'git fetch upstream && git rebase upstream/main',
              '/home/albus/strata166/ci/strata-ci check          # static gate',
              '/home/albus/strata166/ci/strata-ci build          # ~8-10 min',
              '/home/albus/strata166/ci/strata-ci deploy --apply # tag first',
              '```',
              ``,
              'Then walk the patch ledger: `docs/DOWNSTREAM.md` — a patch upstream absorbed',
              'gets deleted, not replayed.',
            ].join('\n');

            if (open.data.length) {
              await github.rest.issues.update({
                owner, repo, issue_number: open.data[0].number, body,
              });
              core.info(`updated #${open.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo,
                title: `upstream: ${behind} new commit(s) to rebase onto`,
                body,
                labels: ['upstream-watch'],
              });
              core.info(`opened #${created.data.number}`);
            }
