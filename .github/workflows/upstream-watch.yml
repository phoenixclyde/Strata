name: Upstream watch

# Tells us when Niko1221/Strata has moved, so a rebase is a decision instead of a surprise.
#
# It deliberately does NOT rebase or push.  Three reasons, all measured or documented:
#   * a push made with GITHUB_TOKEN does not trigger any workflow, so CI would not run on
#     the result -- the branch would look green while nothing had tested it;
#   * our rebase rewrites history (a patch stack on top of upstream), so it needs a
#     force-push to the trunk; doing that unattended is how a trunk gets lost;
#   * the rebase must be followed by an engine rebuild and a bit-exactness check, and this
#     runner has no GPU.
# What is automated is detection and the reminder.  The rebase stays a five-minute human
# step, run by ci/strata-ci watch && git rebase upstream/main.

on:
  schedule:
    - cron: '23 1 * * *'      # 09:23 Asia/Shanghai
  workflow_dispatch:

concurrency:
  group: upstream-watch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watch:
    name: Compare with upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # schedule and workflow_dispatch only run a workflow that exists on the DEFAULT
          # branch, so a copy of this file also lives on `main`.  The ref here is explicit
          # so that copy still measures the trunk we deploy, not main itself.
          ref: gfx906/mi50
          fetch-depth: 0
          persist-credentials: false

      - name: No pipefail/SIGPIPE traps in this workflow
        run: |
          python3 - <<'PYCHECK'
          import re
          from pathlib import Path
          s = Path('.github/workflows/upstream-watch.yml').read_text()
          bad = [l.strip() for l in s.splitlines() if re.search(r"\|\s*head\b", l)]
          assert not bad, "piped head truncates git output and fails under pipefail: %s" % bad
          assert ('issues' + ': write') not in s and ('github.rest.' + 'issues') not in s, \
              "Issues are disabled on this repository; report in the job summary instead"
          PYCHECK
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Niko1221/Strata.git 2>/dev/null || true
          git fetch --quiet upstream '+refs/heads/*:refs/remotes/upstream/*' --tags
          echo "upstream head: $(git log --oneline -1 upstream/main)"
          echo "latest tag   : $(git describe --tags --abbrev=0 upstream/main || echo none)"

      - name: Measure the gap
        id: gap
        run: |
          set -euo pipefail
          behind=$(git rev-list --count HEAD..upstream/main)
          base_tag=$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo none)
          {
            echo "behind=$behind"
            echo "base=$base_tag"
            echo "head_sha=$(git rev-parse --short upstream/main)"
            echo "head_subject=$(git log -1 --format=%s upstream/main)"
          } >> "$GITHUB_OUTPUT"
          echo "behind=$behind (base tag $base_tag)"
          {
            echo 'commits<<EOF'
            git log --oneline -n 30 HEAD..upstream/main
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Report the gap in the job summary
        env:
          BEHIND: ${{ steps.gap.outputs.behind }}
          BASE: ${{ steps.gap.outputs.base }}
          HEAD_SHA: ${{ steps.gap.outputs.head_sha }}
          HEAD_SUBJ: ${{ steps.gap.outputs.head_subject }}
          COMMITS: ${{ steps.gap.outputs.commits }}
        run: |
          set -eu
          {
            echo "## Upstream watch"
            if [ "$BEHIND" = "0" ]; then
              echo "Upstream is fully merged (0 commits behind)."
            else
              echo "**$BEHIND commit(s) behind** `upstream/main` @ `$HEAD_SHA`"
              echo
              echo "Latest upstream tag: `$BASE`"
              echo "Upstream head: $HEAD_SUBJ"
              echo
              echo '```'
              printf '%s\n' "$COMMITS"
              echo '```'
              echo
              echo 'Rebase, then re-verify: static gate -> build -> A/B -> deploy.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
