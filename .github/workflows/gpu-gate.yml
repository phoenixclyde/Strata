name: GPU gate
# W1052/R111: controlled jobs on the self-hosted gfx906 runner (strata166).
# W1075 (M5): migrated from ci/w1047-coverage to the default branch per
# MASTER_GOVERNANCE_PLAN. Branch filter follows the mainline; the GDN_PP step is
# REMOVED here (its script lived only in the frozen ci/workbuddy snapshot and its
# mounts point at trees being deleted) -- tracked as CAR OPEN, see docs/DOWNSTREAM.md.
# SECURITY BOUNDARY (repo is PUBLIC):
#   * This workflow MUST NEVER gain `pull_request` or `pull_request_target` triggers.
#     A PR-triggered job on a self-hosted runner of a public repo is arbitrary code
#     execution for strangers.  Push/workflow_dispatch only -- pushes need write access.
#   * Label-isolated: jobs target [self-hosted, gfx906], never bare `self-hosted`,
#     so a future generic self-hosted job cannot land here by accident.
#   * The runner user `ghrunner` has no sudo beyond `/usr/bin/docker` (sudoers.d).
# W1180/R98: the job also compiles the engine for gfx906 (see "engine compiles").
# 205 s clean, -j 8, from the production image and a frozen llama.cpp tree; it is the
# only place with a HIP toolchain, so it is the only place that can catch a type/API
# error in src/prefill/prefill.cpp or src/program/generate.cpp (the two files W1176
# replaced wholesale).  Moving the production image means updating COMPILE_IMAGE here.
env:
  COMPILE_IMAGE: strata-gfx906:mi50-u0.2.17-6ecd25f0-b12567-101
  COMPILE_GGML: /home/ghrunner/llama-b12567

on:
  workflow_dispatch:
  push:
    branches: [gfx906/mi50]
    # W1184: `ci/**` was here and did not belong.  A ci-only commit cannot change the bytes this job
    # compiles, and on this host every run needs the local mirror refreshed by hand within 300 s (no
    # GitHub egress), so a ci-only push bought a doomed run and a "Run failed" mail.  ci/*.py syntax is
    # already checked by downstream-gate's "Syntax of the 166 tooling" step on every ci/** push.
    paths: ["engine/**", "CMakeLists.txt", ".github/workflows/gpu-gate.yml"]

# W1182: a push supersedes the run before it.  Without this, an older run that is
# still waiting for the mirror reports failure AFTER a newer commit has already gone
# green -- which is exactly the mail noise the owner keeps seeing.  A cancelled run is
# not a failure and sends no mail; the newest commit still gets a full run.
concurrency:
  group: gpu-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-smoke:
    runs-on: [self-hosted, gfx906]
    steps:
      - name: Checkout source is canonical
        run: |
          set -eu
          cfg="$(git config --global --get-regexp insteadof || true)"
          case "$cfg" in
            *ghrunner/mirror/Strata.git*)
              # W1176: the 166 runner has no GitHub egress. A local mirror is allowed
              # only when it already contains the exact commit this run builds; a
              # stale mirror must fail here instead of silently checking out an old sha.
              # W1182: the mirror is refreshed by hand right after the push, and it is
              # refreshed to whatever HEAD is *then* -- so requiring the branch to EQUAL
              # $GITHUB_SHA failed run 45007611965 forever once the mirror had moved on to a
              # newer commit.  What the job needs is that the mirror CONTAINS this commit,
              # so ask git that question and wait for it (300 s); a mirror that never gets
              # the commit is still a hard error.
              ok=0
              for i in $(seq 1 60); do
                if git -C /home/ghrunner/mirror/Strata.git cat-file -e "${GITHUB_SHA}^{commit}" 2>/dev/null &&
                   git -C /home/ghrunner/mirror/Strata.git merge-base --is-ancestor "$GITHUB_SHA" refs/heads/gfx906/mi50 2>/dev/null; then
                  echo "mirror contains $GITHUB_SHA (attempt $i)"
                  ok=1
                  break
                fi
                echo "waiting for the mirror to contain $GITHUB_SHA (head $(git -C /home/ghrunner/mirror/Strata.git rev-parse --short refs/heads/gfx906/mi50 2>/dev/null || echo none), attempt $i/60)"
                sleep 5
              done
              if [ "$ok" != 1 ]; then
                echo "mirror does not contain $GITHUB_SHA after 300 s" >&2
                exit 1
              fi
              ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: device + runner sanity
        run: |
          set -eux
          echo "== identity =="
          id
          test -r /dev/kfd
          ls -la /dev/kfd /dev/dri/renderD128
          echo "== rocm =="
          /opt/rocm/bin/rocminfo 2>/dev/null | grep -m2 'Name:\|gfx' || true
          echo "== runner workdir =="
          pwd
          df -h . | tail -1
      - name: ci tooling smoke (syntax only)
        run: |
          set -eux
          python3 -m py_compile ci/*.py
          bash -n ci/*.sh 2>/dev/null || true
          echo CI_SYNTAX_OK
      - name: engine compiles (HIP, gfx906)
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/strata-compile"
          rm -rf "$out"; mkdir -p "$out"
          sudo -n docker run --rm --name "strata-compile-${GITHUB_RUN_ID}" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src:ro" -v "$out:/out" -v "$COMPILE_GGML:/ggml:ro" -w /out \
            "$COMPILE_IMAGE" bash -lc '
              set -o pipefail
              cmake --fresh -S /src/engine -B /out -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DSTRATA_HIP_GFX906=ON -DSTRATA_ENABLE_CUDA=ON \
                -DSTRATA_NATIVE_EXPERTS=ON -DSTRATA_AMD_COMMUNITY_TUNING=ON \
                -DSTRATA_BUILD_TESTS=OFF -DSTRATA_GGML_DIR=/ggml
              cmake --build /out --target strata -j 8
            '
          echo "engine binary: $(stat -c %s "$out/strata") bytes"
