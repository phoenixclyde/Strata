name: GPU gate
# W1052/R111: controlled jobs on the self-hosted gfx906 runner (strata166).
# W1075 (M5): migrated from ci/w1047-coverage to the default branch per
# MASTER_GOVERNANCE_PLAN. Branch filter follows the mainline; the GDN_PP step is
# REMOVED here (its script lived only in the frozen ci/workbuddy snapshot and its
# mounts point at trees being deleted) -- tracked as CAR OPEN, see docs/DOWNSTREAM.md.
# SECURITY BOUNDARY (repo is PUBLIC):
#   * This workflow MUST NEVER gain `pull_request` or `pull_request_target` triggers.
#     A PR-triggered job on a self-hosted runner of a public repo is arbitrary code
#     execution for strangers.  Push/workflow_dispatch only -- pushes need write access.
#   * Label-isolated: jobs target [self-hosted, gfx906], never bare `self-hosted`,
#     so a future generic self-hosted job cannot land here by accident.
#   * The runner user `ghrunner` has no sudo beyond `/usr/bin/docker` (sudoers.d).
on:
  workflow_dispatch:
  push:
    branches: [gfx906/mi50]
    paths: ["ci/**", ".github/workflows/gpu-gate.yml"]

jobs:
  gpu-smoke:
    runs-on: [self-hosted, gfx906]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: device + runner sanity
        run: |
          set -eux
          echo "== identity =="
          id
          test -r /dev/kfd
          ls -la /dev/kfd /dev/dri/renderD128
          echo "== rocm =="
          /opt/rocm/bin/rocminfo 2>/dev/null | grep -m2 'Name:\|gfx' || true
          echo "== runner workdir =="
          pwd
          df -h . | tail -1
      - name: ci tooling smoke (syntax only)
        run: |
          set -eux
          python3 -m py_compile ci/*.py
          bash -n ci/*.sh 2>/dev/null || true
          echo CI_SYNTAX_OK
