name: Desktop gate

# The Tauri shell is a Rust crate of its own (app/desktop/src-tauri).  Nothing else in CI reads it: the engine
# gates stop at engine/, and the host checks stop at Node.  So until W1183 the only thing that ever compiled this
# crate was a person cutting a bundle by hand -- a Cargo.lock that no longer resolves, or a dependency that
# changed its API, could sit in the tree unobserved.
#
# W1183 is exactly that case: tauri-plugin-updater 2.14.0 -> 2.14.1 moves `zip` 4.6.1 -> 9.8.1 (GHSA-m665-v7pm-7grj
# critical, GHSA-q7v9-x93c-xqv3 high, GHSA-8hxf-qr8p-62x4 medium).  The plugin uses `zip` only under
# `cfg(target_os = "windows")`, so Windows is the only job that can see the changed code; Linux is where main.rs's
# GTK drag/drop hooks live, and where the gtk 0.18 -> glib 0.18 chain is compiled at all.
#
# What this gate is: `cargo check --locked` on both hosts -- every crate in the graph is type-checked, and --locked
# makes a manifest edit without a matching lockfile fail here instead of at release time.  What it is not: no
# bundling, no signing key, no installer, no update actually installed.  It needs placeholder paths for the two
# bundle resources that are build outputs (`../../host/dist`, `resources/harness`); tauri-build only asks that they
# exist, and creating them keeps this a compile gate rather than a packaging one.

on:
  push:
    branches: [main, gfx906/mi50, 'ci/**']
    paths:
      - 'app/desktop/src-tauri/**'
      - '.github/workflows/desktop-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/desktop/src-tauri/**'
      - '.github/workflows/desktop-gate.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux / cargo check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # tauri 2's Linux half is gtk 0.18 + webkit2gtk 4.1; the runner image does not carry the headers.
      - name: GTK / WebKitGTK headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      # tauri 2.12 (and the updater plugin) are edition 2024 with rust-version 1.90; the runner's preinstalled
      # toolchain is not guaranteed to be that new, and the message it prints when it is not is about a dependency.
      - name: Toolchain
        run: rustup update stable --no-self-update && rustc --version && cargo --version
      - name: Bundle resources that are build outputs
        run: mkdir -p app/desktop/src-tauri/resources/harness app/host/dist && printf '<!doctype html><title>placeholder</title>\n' > app/host/dist/index.html
      - name: cargo check
        run: cargo check --locked --manifest-path app/desktop/src-tauri/Cargo.toml

  windows:
    name: Windows / cargo check
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup update stable --no-self-update; rustc --version; cargo --version
      - name: Bundle resources that are build outputs
        shell: bash
        run: mkdir -p app/desktop/src-tauri/resources/harness app/host/dist && printf '<!doctype html><title>placeholder</title>\n' > app/host/dist/index.html
      # This is the job that compiles tauri-plugin-updater's `zip` path (cue: zip is a cfg(windows) dependency of
      # the plugin, and the same is true of webview2-com and windows-core in this crate).
      - name: cargo check
        run: cargo check --locked --manifest-path app/desktop/src-tauri/Cargo.toml
